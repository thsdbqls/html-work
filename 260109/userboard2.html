<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: 0 auto;  /* 중앙 배치하기 위한 코드 */
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);  /* 박스에 효과내기 */
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .form-container {
            margin-top: 20px;
        }
        .form-container input, .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-container button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>게시판</h1>
        <!-- 사용자 목록 -->
        <table>
            <thead>
                <tr>
                    <th>번호</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>전화번호</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td>1</td>
                    <td><a href="#">이름</a></td>
                    <td>hong@gmail.com</td>
                    <td>010-1111-1111</td>
                </tr>
                
                <!-- 게시물 목록은 여기에 추가됩니다 -->
            </tbody>
        </table>

       
    </div>
</body>
</html>

<script>
    /* url을 사용해야 하기 때문에
    도구
    open
    send
    onload=함수
    */
   const xhttp = new XMLHttpRequest();
   xhttp.open("GET","https://jsonplaceholder.typicode.com/users",true);
   xhttp.send();
   xhttp.onload=function(){
    // 데이터가 어떻게 있는지 콘솔을 이용하여 보기
    console.log(xhttp);
   }
</script>
