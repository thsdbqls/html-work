<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // html 문서는 위에서 아래로 순차적으로 로드가 된다.
        window.document.querySelector("title").innerText="javascript document"
        // window.document.querySelector("body").innerText="javascript document"
        // Cannot set properties of null (setting 'innerText')
        // 이 메세지는 객체를 찾을 수 없어서 발생하는 오류 메시지 이다

        /*html 문서 내의 모든 태그는 html 태그로 부터 시작되고 
        html을 수집하면 모든 태그에 접근이 가능하다.*/
        let all=document.querySelectorAll("html");
        console.log(all);
        console.log(all[0]);  //nodelist를 확장하면 0에 해당하는 부분
        console.log(all.length)  //nodelist를 확장하면 length에 해당하는 부분(속성)

        //prototype 확장
        // console.log(all[0].item());  //접근 오류 발생
        console.log(all.item(0));       
        console.log(all.item(0).length);  //undefined : 결과가 없음
        console.log(all.item(0).name);

        // all 객체를 이용해서 title 객체에 접근하기
        let head=all.item(0).querySelector("head");      // all.item(0) 은 all[0]와 같다
        let title = head.querySelector("title");
        console.log(title.innerHTML);
        console.log(title.innerText);
        console.log(title.textContent);

        title.textContent="change Title!!"


        //body 태그 안에 h1이라는 태그를 넣고 싶은 경우 동작 순서 확인
        /* 
        h1 태그 가 존재하지 않으므로 h1을 만들어야 한다
        1) h1 태그를 생성한다. create, tag==element (태그는 엘리멘트 이다) => document.createElement("h1");
        2) 태그 안에는 속성=값 이 존재하기 때문에 태그에 속성을 생성하고 값을 부여한다.(id, class, style, contentText)
        3) 만들어진 객체를 body 태그 안에 주입한다.
        */

        let h1= document.createElement(h1);
        h1.id="main";
        h1.className="main";
        h1.name="main";
        h1.style.backgroundColor="yellow";
        h1.textContent="h1 태그를 만들었습니다";
        all[0].querySelector("body").appendChild(h1);
        // 오류가 발생하는 이유는 body를 읽을 수가 없으므로 오류 발생
        // addElement.html에서 처리하기로 함
        
    </script>
</head>
<body>
    
</body>
</html>
