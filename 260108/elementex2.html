<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" onsubmit="return confirm()">
        <label for="">이름</label>
        <input type="text" name="name" id="name">
        <br>
        <label for="">전화번호</label>
        <input type="text" name="hp" id="hp">
        <br>
        <label for="">이메일</label>
        <input type="text" name="email" id="email">
        <br>
        <label for="">주소</label>
        <input type="text" name="address" id="address">
        <br>

        <input type="submit" value="전화번호저장">
    </form>
    
</body>
</html>
<script>
    function confirm(){
        let name = document.getElementById("name");
        let hp = document.getElementById("hp");
        let email = document.getElementById("email");
        let address = document.getElementById("address");

        // 유효성 검사(비어있는지 여부 확인, 길이(사이즈)확인, 형식확인, 데이터 범위 확인)
        if(name.value==""){
            alert("이름이 비여있습니다");
            name.focus();
            return false;
        }

        if(hp.value.lenght != 13){
            alert("전화번호 길이를 확인하세요");
            hp.value="";
            hp.focus();
            return false;
        }

        if(!email.value.includes("@")){
            alert("이메일 형식을 확인하세요");
            email.focus();
            return false; 
        }

        if(!isKoreanAddress(address.value)){
            alert("주소 형식을 확인하세요");
            address.focus();
            return false; 
        }

    }

    function isKoreanAddress(text) {
  if (!text || typeof text !== "string") return false;

  const value = text.trim();

  // 1. 행정구역 키워드
  const regionPattern = /(시|도|군|구|읍|면|동|리)/;

  // 2. 도로명 주소 (로, 길 + 숫자)
  const roadPattern = /(로|길)\s*\d+/;

  // 3. 지번 주소 (동/리 + 번지)
  const lotNumberPattern = /(동|리)\s*\d+(-\d+)?/;

  // 4. 전체 주소처럼 길이가 너무 짧으면 제외
  if (value.length < 6) return false;

  let score = 0;
  if (regionPattern.test(value)) score++;
  if (roadPattern.test(value)) score++;
  if (lotNumberPattern.test(value)) score++;

  // 2개 이상 맞으면 주소로 판단
  return score >= 2;
}

    
</script>
