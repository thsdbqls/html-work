<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="login_proc.html" method="post" onsubmit="return confirm()">
        <ul>
            <li><input type="text" name="id" id="id" placeholder="아이디"></li>
            <li><input type="text" name="password" id="password" placeholder="비밀번호"></li>
            <li><input type="submit" value="로그인"></li>

        </ul>
    </form>
</body>
</html>
<script>
    // 어떤 내용에 대해서 유효성 검사를 할지를 정하는 것이 문제이다.
    /* 
    비여있는지
    길이
    형식
    범위(데이터)
    */
   /* 
   아이디 : 비여있는지, 길이가 5자 이상 9자 미만
   비밀번호 : 비여있는지,특수문자/숫자/영문자(대문자 한개 이상 포함) 유무 , 길이가 5자 이상 9자 미만
   */
    function confirm(){
        const id = document.getElementById("id");
        const password = document.getElementById("password");

        if(id.value===""){
            alert("아이디가 비어있습니다");
            id.focus();
            return false;
        }

        if(!(id.value.length >=5 && id.value.length <9)){
            alert("아이디 길이를 확인하세요");
            id.focus();
            return false;
        }

        if(password.value===""){
            alert("비밀번호가 비어있습니다");
            password.focus();
            return false;
        }

        if(!(password.value.length >=5 && password.value.length <9)){
            alert("비밀번호 길이를 확인하세요");
            password.focus();
            return false;
        }

        // 정규식(RegExp) (자바 뿐만 아니라 모든 언어에서도 사용된다.)
        // "" 가 없어서 문자열은 아니다
        // /~/가 있는 것이 정규식이다.
        const regex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^\w\s]).+$/;

        //
        if(!regex.test(password.value)){
            alert("비밀번호를 다시 입력하세요");
            password.focus();
            return false;
        }

        
    }

    console.log(/^(?=.*[A-Z])/.test("abcdef"))
</script>
