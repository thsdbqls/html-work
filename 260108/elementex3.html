<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" onsubmit="return confirm()">
        <label>이름</label>
        <input type="text" name="name" id="name">
        <br>
        <label>전화번호</label>
        <input type="text" name="hp" id="hp">
        <br>
        <label>이메일</label>
        <input type="text" name="email" id="email">
        <br>
        <label>주소</label>
        <input type="text" name="address" id="address">
        <br>

        <input type="submit" value="전화번호저장">
    </form>
</body>
</html>
<script>
    let inputs = document.querySelectorAll("input[type='text']");
    console.log(inputs);
    // 알아야 할 사항은 inputs 배열의 순서대로 어떤 내용이 저장되는지 확인하는 것이다

    // 유효성 검사 사항 중 값이 비어 있으면 안되는 경우를 처리
    //아래 함수의 문제점 : forEach 함수가 콜백 함수이므로 코드가 중간에 중지되지 않는 문제 발생
    /*
    function confirm(){
        inputs.forEach(Element => {
            alert("입력한 값이 비여있습니다");
            Element.focus();
            return false;
        })
    }*/

    // 아래의 함수는 콜백함수가 아니므로 false를 만나는 순간 함수가 종료되므로 정상처리가 됨
   function confirm(){
    for(Element of inputs){
        if(Element.value===""){
            alert("입력한 값이 비여있습니다");
            Element.focus();
            return false;
        }
    }
   }
</script>
