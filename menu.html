<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        nav{border: 1px solid green;}
        ul{border: 1px solid orange;}
        li{border: 1px solid black;}
        li{list-style: none;}
        ul{display: flex;} 
        li:hover{background-color: black; color: white;}
        /* ul{justify-content: space-between;} */
        ul{justify-content: space-around;}  /*자동으로 구분해 줌*/
        li{padding: 8px 12px;}
        nav,ul,li{border: none;}
        li{border-radius: 5px;}

        
    </style>
</head>
<body>
    <!-- nav 태그에 id는 menu, class는 nav_menu, ul을 이용하여 메뉴 4개 작성하고
     메뉴의 이름은 MENU1~MENU4인 태그를 나타내시오 -->
     <!-- nav#menu.menu_nav>ul>li*4{MENU$} -->
      <!-- 클래스를 이용한 기본 메뉴를 만드세요
       1) 모든 태그의 margin, padding을 0으로 처리
       2) nav(green), ul(orange), li(black) 태두리를 생성
       3) display를 flex로 처리
       4) li의 점을 없앰
       5) 마우스가 올라가면 반전색처리(배경 :검정, 글자 : 흰색)
       6) li를 중앙정렬(상위태그 정렬)
       7) li태그의 상하좌우의 간격을 조절
       8) 모든 테두리(nav, ul, li)를 제거
       9) 테두리를 둥글게 처리  -->
     <nav id="menu" class="menu_nav">
        <ul>
            <li>MENU1</li>
            <li>MENU2</li>
            <li>MENU3</li>
            <li>MENU4</li>
        </ul>
     </nav>

     <h3>My WEB PAGE!!</h3> 
     <!-- 이것은 텍스트 형식이다 -->
     <style>
        /*h3은 중앙정렬이 되어 있지 않음*/
        h3{justify-content: center;} /*이것을 해도 중앙정렬이 안된다*/ 
        h3{text-align: center;} /* 이것을 하면 중앙 정렬이 된다*/
        /* 그 이유는 text에 있다. 
        tap(content) 콘텐츠 안에 있는 text에 대한 정렬을 정한다
        justify는 콘텐츠 일때만 사용됨 -> 콘텐츠를 정렬*/
     </style>
</body>
</html>
