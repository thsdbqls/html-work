<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;
          padding: 0;}
        .header>header, .footer>footer{
            width: 100%;
            height: 50px;
            background-color: gray;
            text-align: center;
            line-height: 50px;
            /* align-content:  */
            font-size: 30px;
            color:white;
            
        }
        .main{display: flex;}
        .main>aside{width: 20%; height: 70vh;
                    background-color: aqua;
                    display: inline;}
        main{display: inline-block;
            margin: 10px;} 
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <header>Cities</header>
        </div>
        <div class="main">
            <aside><div>
                <li onclick="loadpage('london.html')">런던</a></li>
                <li onclick="loadpage('tokyo.html')">도쿄</a></li>
                <li onclick="loadpage('paris.html')">파리</a></li>
            </div></aside>
            <main><div id="main">
               main
               <article>
                <h2 id="city">city</h2>
                <p>
                    <dl>
                    <dt id="kind">kind</dt>
                    <dd id="desc">desc</dd>
                    </dl>
                </p>
            </article>
            </div></main>
        </div>
    
        <div class="footer"><footer>footer</footer></div>
    </div>

    <script>
        // 객체 얻기
        const xhttp = new XMLHttpRequest();
        xhttp.open("get","object.json", true);
        xhttp.send();

        xhttp.onreadystatechange=function(){
            console.log(xhttp.responseText);
            //              분석
            let obj = JSON.parse(xhttp.responseText);
            console.log(obj.city);
            console.log(obj.kind);
            console.log(obj.desc);

            document.getElementById("city").textContent=obj.city
            document.getElementById("kind").textContent=obj.kind
            document.getElementById("desc").textContent=obj.desc
        }
    </script>

</body>
</html>
