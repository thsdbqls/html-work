    <article>
        <h2>도쿄</h2>
        <p>
            <dl>
                <dt>도쿄 정보</dt>
                <dd>
                    나라: 일본(Japan)<br>
                    지위: 수도<br>
                    위치: 일본 혼슈 동부, 간토 지방<br>
                    인구: 약 1,400만 명 이상<br>
                    언어: 일본어<br>
                    통화: 엔(¥)
                </dd>
            
                <dt>특징</dt>
                <dd>
                    일본의 정치·경제·문화 중심지<br>
                    세계 최대 규모의 대도시권<br>
                    전통과 첨단 기술이 공존
                </dd>
            
                <dt>유명한 명소</dt>
                <dd>
                    도쿄 타워<br>
                    스카이트리<br>
                    아사쿠사 센소지<br>
                    시부야 스크램블 교차로<br>
                    황궁
                </dd>
            </dl>
            
        </p>
    </article>
