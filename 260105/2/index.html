        function loadpage(url){
            const main=document.getElementById("main");
        
        const xhttp=new XMLHttpRequest();
        xhttp.open("GET",url,true); 
        xhttp.send(); //보내기
        //  수신하기
        xhttp.onreadystatechange=function(){
            
            main.innerHTML=xhttp.responseText;
        }
        }
