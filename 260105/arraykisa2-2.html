<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { margin: 0; padding: 0; }
        
        div {
            border: 1px solid black;
            width: 150px;
            height: 100px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer; /* 마우스 올릴 때 커서 바뀌게 */
        }

        div:hover {
            background-color: blue; /* 배경 색 */
            color: white; /* 텍스트 색 */
        }
    </style>
</head>
<body>
    <div id="myDiv">
        서울신문
    </div>

    <script>
        const div = document.getElementById("myDiv");

        // 마우스를 올릴 때
        div.addEventListener("mouseover", function() {
            div.innerText = "구독|기사보기";
        });

        // 마우스를 떼었을 때
        div.addEventListener("mouseout", function() {
            div.innerText = "서울신문";
        });
    </script>
</body>
</html>
