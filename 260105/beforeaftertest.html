<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    .content{
        width: 100px; 
        height: 100px;
        border: 1px solid black;
        
    }
    
    .content:hover{
        /* 글자 색만 반전 */
        color: transparent;
    }

    .content:hover::after{
        content: "구독|기사보기";
        color: black;
    }
    .wrap{position: relative;}
    .wrap:hover{position: relative;}
    .content{position: absolute; top: 0; left: 0;}
    .content:hover::after{position: absolute; top: 0; left: 0;}

    /* 배경색과 글자색 처리 */
    .content:hover::after{
        color: white;
        background-color: blue;
    }

    /* 너비 처리 */
    .wrap{width: 100px; height: 100px;}
    .content:hover::after{
        width: 100%; height: 100%;
    }
    
</style>


<body>
    <!-- 
    1) div class wrap 작성
    2) div class content 작성
    3) .content 기본 네모 블럭 만들기(스타일 태그 작성)
    4) .content:hover color: transparent; 변환
    5) .content::before 작성 (반드시 content속성을 추가)
    6) .content::after 작성 (반드시 content속성을 추가)
    7) .wrap의 속성 중 position 속성을 relative 로 변경
    8) .content 속성 중 position 속성을 absolute로 변경
    9) .content의 일반 속성, before속성, after 속성 중 top, left를 적당한 값으로 처리
    -->
    <div class="wrap">
        <div class="content">content</div>
    </div>
    
</body>
</html>
