<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            display: flex; /* 단순히 flex일 경우 한줄에서 아래줄로 내려가지 않는 문제가 발생 */
        flex-wrap: wrap;  /* flex일때 줄바꿈을 허용한다 , width와 height 속성이 적용이 됨*/
        align-items: center; /*  태그에 대한 정렬이므로 현재 태그는 꽉찬 상태이므로 정렬이 안된다. */
        }

        .content{
            width: 100px; height: 100px;
            border: 1px solid black;
            text-align: center;  /* 좌우 정렬  */
            align-content: center;  /* 세로(위아래) 정렬 */
        }
        
    </style>

</head>
<body>
    <div class="wrap" id="wrap">
        <div class="content">
            서울신문
        </div>
    </div>

    <script>
        // 1개의 데이터가 여러개 있을 경우 []: 배열을 사용한다
        // var news=["서울신문","MBC","KBS","SBS"]
        const news = [
        "서울신문",
        "조선일보",
        "중앙일보",
        "동아일보",
        "한겨레",
        "경향신문",
        "한국일보",
        "매일경제",
        "한국경제",
        "SBS",
        "KBS",
        "MBC",
        "YTN",
        "연합뉴스"
        ];
    
        //배열을 for문으로 처리하는 방법
        for(i=0;i<news.length;i++){
            // const div =document.createElement("div")
            let div="<div id='content' div class='content' onmouseover='contentstyle(this)' onmouseout='contentstyle2(this)'>"+news[i]+"</div>";
            document.getElementById("wrap").innerHTML+=div;
        }

        function contentstyle(obj){
            console.log('access!!');
            obj.style.backgroundColor="blue";
            obj.style.color="white";
            obj.textContent="구독|기사보기"
        }

        function contentstyle2(obj){
            console.log('access!!');
            obj.style.backgroundColor="white";
            obj.style.color="black";
            // 마우스 아웃을 한 객체 찾기
            let divs=document.querySelectorAll(".content");
            console.log("전체 갯수:"+divs.length);
            // (()->{}) 가장 최근에 나온 함수
            // function 함수명(){}
            // 익명 함수 : a = funtion(){}
            // 화살표 함수(람다 함수) : ()=>{}
                    // 하나를 받고
            divs.forEach((div,index)=>{  //모든것을 다 하나씩 비교
                if(div==obj){
                    console.log("같은 객체:"+index);
                    div.textContent=news[index];
                }else{
                    //console.log("다른 객체");
                }
            }); 
            
        }
        
    </script>
</body>
</html>
