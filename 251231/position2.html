<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1{
            position: relative;  /* absolute, relative일 때 확인  */
            top: 20px;
            left: 100px;
            background-color: aqua;
            width: 100px;
            height: 100px;
        }
        #div2{
            background-color: aquamarine;
            width: 100px;
            height: 100px;
        }
        #div3{
            position: absolute;
            top: 20px;
            left: 100px;
            background-color: orange;
            width: 100px;
            height: 100px;
        }
        #div4{
            background-color: blue;
            width: 100px;
            height: 100px;
        }
        #div41{
            background-color: rgba(255, 255,0,0.2);
            width: 100px;
            height: 100px;
            position: relative;
            top: 100px;
            left: 100px;
        }
    </style>
</head>
<body>
    <div id="div1">div1</div>
    <div id="div2">div2</div>
    <div id="div3">div3</div>
    <div id="div4">div4</div>
    <div id="div41">div41</div>
</body>
</html>
