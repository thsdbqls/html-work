<style>
    #stickydiv{
            position: sticky;

            left: 100px;
            background-color: orange;
            width: 100px;
            height: 100px;
    }
    div{
        width: 100%;
        height: 300px;
        background-color: yellow;
    }
</style>
<body>
    <div id="stickydiv"></div>
    <div></div>
</body>
