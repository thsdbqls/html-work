<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        
        nav{display: flex;}

        ul{display: flex; }

        nav, .navbar_logo, .navbar_menu, .navbar_icon{list-style: none;}
        .navbar{border: 1px solid black;}
        *{margin: 0; padding: 0;}

        .navbar_logo{border: 1px solid red;}
        .navbar_menu{border: 1px solid green;}
        .navbar_icon{border: 1px solid blue;}

        /* navbar에서 로그는 왼쪽, 메뉴는 중앙, 아이콘을 오른쪽 배치 */
        .navbar{justify-content: space-between;}
        /* navbar_menu의 내용을 위 아래 좌 우 간격을 조정 - padding 이용 */
        .navbar_menu > li{padding: 8px 10px;} /* 상하 : 8px 좌우 : 10px*/

        /* navbar_logo와 navbar_icon을 항목 중앙 정렬  */
        .navbar{align-items: center;}
        /* 아이콘 간격 상하 좌우 */
        .navbar_logo > li{padding: 8px 0px;}
        .navbar_icon > li{padding: 8px 5px;}

        /* 배경색, 글자색, 글자크기 설정 */
        /* 전체 navbar에 대한 배경 색상, 글자 색상, 글자 크기 지정 */
        .navbar{background-color: #263343;
                color: white;}

        /* 보더border 없애기 */
        .navbar, .navbar_logo, .navbar_menu, .navbar_icon{border: none;}

        /* 개별 배경색상, 글자색상, 글자크기 지정 */
        .navbar_logo{font-size: 20px;}
        .navbar_menu{font-size: 25px}
        .navbar_icon{font-size: 30px}

        /* 효과 지정 */
        /* 메뉴에 마우스를 올렸을 때 배경, 글자색 변경 */
        .navbar_menu > li:hover{background-color: white; 
                                color: black;
                                border-radius: 5px;
                            }


        /* 메뉴 바 icon을 코드에 넣은 후 표시되지 않게 처리하는 방법 */
        /* 미디어 커리 전에 사전 설정을 해야함 display가 적용됨 */
        .fa-bars{
            display: none;
            position:absolute;
            top:10px;
            right:10px;
        }
        /* 화면의 표시 여부는 display에 none, block으로 처리 가능 */
        


        /* 스크린 너비가 768보다 작을 경우 적용하는 스타일 */
        /* 기본 flex는 한 행에 여러가지 요소가 나열되지만 , 한줄로 처리 */
        @media screen and (max-width:768px) {
            .navbar{
                flex-direction: column;
            }
        

            .navbar_menu{
                /* flex-direction:column-reverse : 배치를 반대로 한다 */
                /* flex-direction:column : 배치를 세로로 다시 한다 */
                flex-direction:column;
                /* 메뉴를 선택했을 때 전체 행이 반전되도록 처리, 문제점 : 좌측정렬 */
                width: 100%;
                /* 좌측정렬 문제점 해결 - 다른 문제점은 width가 100%가 적용 안되는 문제 발생 */
                /* align-items: center; */
            }

            /* 좌측정렬 문제점 해결*/
            .navbar_menu > li{
                text-align: center;
            }

            .fa-bars{
                display: block;
            }
        }

        
        
        /* 배경색이 흰색이므로 바가 보이지 않으므로 회색으로 변경 */
        body{
            background-color: gainsboro;
        }
       
        /* 메뉴에 a링크를 처리할 경우 a tag의 color와 밑줄이 처리되어 있는 디자인 문제 */
        
        .navbar_menu>li>a{
            color: white;
            text-decoration: none;
        }

        .navbar_menu>li>a:hover{
        color: black;
        }

        /* li에 마우스 over가 될 때 하위 a 태그의 속성을 변경하라 */
        .navbar_menu>li:hover>a{
        color: black;
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <ul class="navbar_logo">
            <li><i class="fa-brands fa-accusoft"></i></li>
            <li>SEOIL</li>
        </ul>
    
        <ul class="navbar_menu">
            <li><bottom onclick="">회사소개</bottom></li>
            <li>사업안내</li>
            <li>예약안내</li>
            <li>갤러리</li>
            <li><a href="board.html">게시판</a></li>
        </ul>

        <ul class="navbar_icon">
            <li><i class="fa-solid fa-envelope"></i></li>
            <li><i class="fa-solid fa-camera"></i></li>
            <li><i class="fa-solid fa-user-plus"></i></li>
        </ul>
        <li><i class="fa-solid fa-bars"></i></li>

    </nav>
    
    
</body>
</html>
