    <!-- 다이얼로그 접근 방법 -->
     <dialog open>
        this is an open dialog window
        <button onclick="dialogtoggle()">다이얼로그 열고 닫기</button>
    </dialog>

     <button onclick="dialogtoggle()">다이얼로그 열고 닫기</button>
     <script>
        let dialog=document.querySelector("dialog");
        // dialog.showModal
        // dialog.open=true;
        // 함수 dialogtoggle()을 이용하여 2가지 상태를 해야 한다.
        let openstate=true;
        function dialogtoggle(){
            //오픈 상태가 열려있으면
        if(openstate==true){
            // 값을 false로 하여 닫고
            dialog.open = false;
            // 오픈 상태를 false로 바꾼다
            openstate = false;
        }else{
            dialog.open = true;
            openstate = true;
        }
        }
       
     </script>
