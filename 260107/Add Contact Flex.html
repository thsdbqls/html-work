<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
<style>
    .wrap{
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        /* height: 852px; */
        border: 1px solid gray;
        border-radius: 10px;
    }

    .header{
        width: 100%;
        height: 50px;
        background-color: grey;
        /* text-align: center; */

        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        
        /* align-content: center; */
    }

    .header h3{
        
        text-align: center;
        line-height: 50%;
        /* align-content: center; */
    }

    .name, .phone, .email, .address{
            position: relative;
            margin-top: 10px;
            
    }

    .body{
        display: flex;
        flex-direction: column;
        align-content: center;
        text-align: center;
        
        width: 100%;
        height: 80vh;

        position: relative;
    }

    .body i{
        position: absolute;
        top: 50%;
        left: 6%;
        transform: translate(0%,-35%);
        
    }

    .name input[type="text"], .phone input[type="text"], 
    .email input[type="text"], .address input[type="text"]{
        width: 85%;
        padding-left: 25px;
    }

    .footer{
        width: 100%;
        height: 12vh;
        background-color: grey;
        text-align: center;
        align-content: center;
       
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
    }

    .footer input[type="button"]{
        width: 10%;
        height: 10vh;
        border: none;
        border-radius: 30px;
        background-color: blue;
        color: white;
    }

    .footer input[type="submit"]{
        width: 10%;
        height: 10vh;
        border: none;
        border-radius: 30px;
        background-color: red;
        color: black;
    }

    
</style>
<body>
    <div class="wrap">
        <div class="header">
            <h3>Add Contact</h3>
        </div>
        <div class="body">
            <div class="name"><input type="text" placeholder="Name">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="phone"><input type="text" placeholder="Phone Number">
                <i class="fa-solid fa-phone"></i>
            </div>
            <div class="email"><input type="text" placeholder="Email">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="address"><input type="text" placeholder="Address">
                <i class="fa-solid fa-location-dot"></i>
            </div>
        </div>
        
        <div class="footer">
            <input type="submit" value="Cancel">
            <input type="button" value="Save">
        </div>
    </div>
</body>
</html>
