<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .name, .phone, .email, .address{
            position: relative;
        }

        .body i{
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translate(0%,-35%);
        }

        
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <h3>Add Contact</h3>
        </div>
        <div class="body">
            <div class="name"><input type="text" placeholder="Name">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="phone"><input type="text" placeholder="Phone Number">
                <i class="fa-solid fa-phone"></i>
            </div>
            <div class="email"><input type="text" placeholder="Email">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="address"><input type="text" placeholder="Address">
                <i class="fa-solid fa-location-dot"></i>
            </div>
        </div>
        
        <div class="footer">
            <input type="reset" value="Cancel">
            <input type="button" value="Save">
        </div>
    </div>
</body>
</html>

<!-- 위의 코드의 문제점 : inputbox와 아이콘이 겹치는 문제 발생
 input tag의 value에 &nbsp를 제거하고 padding처리를 함 -->
 <style>
    /* 아이콘과 텍스트 박스가 겹쳐져서 입력을 할때 아이콘이 가려지게 되어서 */
    .body input[type='text']{
            /* padding-left를 이용하여 간격을 띄우게 한다 */
            padding-left: 20px;
        }
 </style>

 <!-- 디자인 처리 -->
  <style>
    .wrap{
        width: 393px;
        height: 852px;
        border: 1px solid gray;
        border-radius: 10px;
    }
    .header{
        background-color: gray;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }
    .header>h3{
        color: white;
        text-align: center;
        margin: 0;
        padding-top: 20px;
        padding-bottom: 20px;

    }

    /* .wrap{width: 50%;} */
    .name>input{
        width: 85%;
        height: 30px;
    }

    .body{
        text-align: center;
    }

    .name, .phone, .email, .address{
        margin-top: 20px;
    }

    .phone>input{
        width: 85%;
        height: 30px;
    }

    .email>input{
        width: 85%;
        height: 30px;
    }

    .address>input{
        width: 85%;
        height: 30px;
    }

    .body{
        /* height: calc((852*0.8)px); */
        height: calc(852px*0.8);
        /* background-color: aquamarine; */
        border-bottom: solid 1px gainsboro;
    }
  </style>

  <!-- footer 밑에 버튼 처리 -->
   <style>
        .footer>input[type="button"]{
            width: 40%;
            height: 30px;
            background-color: brown;
            color: white;
            border:none;
            border-radius: 5px;
        }

        .footer>input[type="reset"]{
            width: 40%;
            height: 30px;
            background-color: blue;
            color: white;
            border:none;
            border-radius: 5px;
        }

        .footer{
            text-align: center;
            padding-top: 30px;
            
        }
   </style>
