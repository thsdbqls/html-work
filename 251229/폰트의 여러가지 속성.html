<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div{
        border: 1px solid red;
        font-size: 20px;
        color: orange;
        /*한 문자와 한 문자 사이의 간격*/
        letter-spacing: 0px;
        /* 단어와 단어 사이의 간격 */
        word-spacing: 20px;
        /* 박스의 크기를 정할 때*/
        width: 300px;
        height: 30px;
        /* 박스 크기에 맞는 글자만 표시되고 나머지는 감추는 */
        overflow: hidden;
        /*  */
        text-overflow: ellipsis;
        white-space: nowrap;
        /* 테두리를 각지게 하는 것 */
        border-radius: 5px;
    }
    </style>
</head>
<body>
    <div>
        동해물과 백두산이 마르고 닳도록 하느님이 보우하사 우리 나라 만세
    </div>
</body>
</html>
