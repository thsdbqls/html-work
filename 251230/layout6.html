<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{font-size: 50px; color: white; text-align: center;}
        #wrap{background-color: aqua; font-size: 30; 
               width:100%; height: auto; }

        #header-top-wrap{width:100%; height: 200px; background-color: rgba(0, 255, 255, 0.815); margin: 0 auto; }
        #header-nav-wrap{width:100%; height: 200px; background-color: rgba(79, 192, 192, 0.603); margin: 0 auto;}
        #banner-wrap{width:100%; height: 500px; background-color: rgba(0, 255, 255, 0.432); margin: 0 auto;}
        #content1-wrap{width:100%; height: 400px; background-color: rgba(21, 58, 58, 0.349); margin: 0 auto;}
        #content2-wrap{width:100%; height: 600px; background-color: rgba(62, 121, 121, 0.815); margin: 0 auto;}
        #content3-wrap{width:100%; height: 500px; background-color: rgba(53, 199, 199, 0.534); margin: 0 auto;}
        #footer-nav-wrap{width:100%; height: 100px; background-color: rgba(30, 102, 102, 0.562); margin: 0 auto;}
        #footer-info-wrap{width:100%; height: 300px; background-color: rgba(23, 75, 75, 0.452); margin: 0 auto;}

        .header-top-container{margin: 0 auto; background-color: aquamarine; width: 1000px; height: inherit;  line-height: 200px;}
        .header-nav-container{margin: 0 auto; background-color: rgb(12, 221, 151); width: 1000px; height: inherit; line-height: 200px;}
        .banner-container{margin: 0 auto; background-color: rgb(32, 112, 85); width: 1000px; height: 500px; line-height: 500px;}
        .content1-container{margin: 0 auto; background-color: rgb(129, 212, 185); width: 1000px; height: 400px; line-height: 400px;}
        .content2-container{margin: 0 auto; background-color: rgb(23, 48, 39); width: 1000px; height: 600px; line-height: 600px;}
        .content3-container{margin: 0 auto; background-color: rgb(97, 150, 132); width: 1000px; height: 500px; line-height: 500px;}
        .footer-nav-container{margin: 0 auto; background-color: rgb(150, 212, 192); width: 1000px; height: 100px; line-height: 100px;}
        .footer-info-container{margin: 0 auto; background-color: rgb(23, 233, 163); width: 1000px; height: 300px; line-height: 300px;}
    </style>
</head>
<body>
    <div id="wrap">
        <div id="header-top-wrap">
            <div class="header-top-container">
                header-top
            </div>
        </div>

        <div id="header-nav-wrap">
            <div class="header-nav-container">
                header-nav
            </div>
        </div>

        <div id="banner-wrap">
            <div class="banner-container">
                banner
            </div>
        </div>

        <div id="content1-wrap">
            <div class="content1-container">
                content1
            </div>
        </div>

        <div id="content2-wrap">
            <div class="content2-container">
                content2
            </div>
        </div>

        <div id="content3-wrap">
            <div class="content3-container">
                content3
            </div>
        </div>

        <div id="footer-nav-wrap">
            <div class="footer-nav-container">
                footer-nav
            </div>
        </div>

        <div id="footer-info-wrap">
            <div class="footer-info-container">
                footer-info
            </div>
        </div>
    </div>
</body>
</html>
